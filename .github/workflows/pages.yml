name: Deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm run pages:check

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          for asset in \
            data-views.html \
            medication-classes.html \
            medication-class-examples.html \
            assets/logo-mark.png \
            assets/auxiliary-pages.css \
            logo.png \
            manifest.json \
            icon-32.png \
            icon-180.png \
            icon-192.png \
            icon-512.png \
            og-image.png \
            robots.txt \
            sitemap.xml
          do
            mkdir -p "$(dirname "dist/$asset")"
            cp "$asset" "dist/$asset"
          done
          mkdir -p dist/src/data
          cp src/data/*.js dist/src/data/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
