name: CI

on:
  push:
    branches-ignore: ["main"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      full:
        description: "Run data, integration, and severity-report gates"
        type: boolean
        default: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm run security:audit

      - name: Unit gate
        run: npm run test:unit

      - name: Data and boundary gate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        run: npm run test:data

      - name: Integration gate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        run: npm run test:integrations

      - name: Severity report generation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        run: npm run report:severity
